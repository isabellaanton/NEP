<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pontos no Mapa - UNIFOR</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f7fa;
      color: #333;
    }

    header {
      background: #003aa6;
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 1.4rem;
    }

    #controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 1rem;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      flex-wrap: wrap;
      align-items: center;
    }

    input, button {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      background: #003aa6;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #002f80;
    }

    #map {
      width: 100%;
      height: 70vh;
    }

    #markerList {
      list-style: none;
      padding: 10px;
      margin: 0;
      background: #fff;
      border-top: 1px solid #ccc;
      font-size: 0.95rem;
    }

    #markerList li {
      padding: 6px;
      border-bottom: 1px solid #eee;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #f1f1f1;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    Mapa Interativo: Encontre os Pontos Escondidos!
  </header>

  <section id="controls">
    <label for="latitude">Latitude:</label>
    <input type="text" id="latitude" placeholder="Ex: -3.7698813554732262">
    <label for="longitude">Longitude:</label>
    <input type="text" id="longitude" placeholder="Ex: -38.47914681222398">
    <label for="markerName">Nome do Marcador:</label>
    <input type="text" id="markerName" placeholder="Ex: NEP">
    <button onclick="addMarker()">Adicionar Ponto</button>
  </section>

  <div id="map"></div>

  <!-- Lista de pontos adicionados -->
  <ul id="markerList"></ul>

  <footer>
    Núcleo de Extensão e Práticas (NEP) - 2025
  </footer>

  <script>
    let map;

    function initMap() {
      const centro = { lat: -3.769, lng: -38.478 }; // UNIFOR aproximado
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 16,
        center: centro,
      });

      // Evento de clique no mapa para adicionar marcador
      map.addListener("click", function(event) {
        addMarkerAtPosition(event.latLng);
      });
    }

    function addMarker() {
      const lat = parseFloat(document.getElementById("latitude").value);
      const lng = parseFloat(document.getElementById("longitude").value);
      const title = document.getElementById("markerName").value || "Ponto";

      if (!isNaN(lat) && !isNaN(lng)) {
        new google.maps.Marker({
          position: { lat, lng },
          map: map,
          title: title,
          draggable: true
        });
        map.setCenter({ lat, lng });

        addMarkerToList(title, lat, lng);
      } else {
        alert("Insira valores válidos de latitude e longitude!");
      }
    }

    function addMarkerAtPosition(latLng) {
      const markerName = prompt("Nome do marcador:", "Ponto") || "Ponto";
      new google.maps.Marker({
        position: latLng,
        map: map,
        title: markerName,
        draggable: true
      });
      map.setCenter(latLng);

      document.getElementById("latitude").value = latLng.lat();
      document.getElementById("longitude").value = latLng.lng();
      document.getElementById("markerName").value = markerName;

      addMarkerToList(markerName, latLng.lat(), latLng.lng());
    }

    function addMarkerToList(name, lat, lng) {
      const list = document.getElementById("markerList");
      const item = document.createElement("li");
      item.textContent = `${name} → [${lat.toFixed(5)}, ${lng.toFixed(5)}]`;
      list.appendChild(item);
    }
  </script>

  <!-- API Google Maps -->
  <script async defer 
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBPTCXr83TDK2EevM1-Ff6_621dUFe08HM&callback=initMap">
  </script>
</body>
</html>
